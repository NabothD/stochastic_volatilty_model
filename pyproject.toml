[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "svuq"
version = "2.0.0"
description = "Bayesian estimation and uncertainty quantification for the Heston and Bates stochastic-volatility models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "numba>=0.59",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
quantlib = ["QuantLib>=1.30"]
chaospy = ["chaospy>=4.3"]
data = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "D", "UP", "N", "SIM"]
ignore = ["N802", "N803", "N806", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["svuq"]
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
